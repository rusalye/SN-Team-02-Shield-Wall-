services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: shieldwall-juice
    networks: [backend]
    expose: ["3000"]
    restart: unless-stopped

  waf:
    image: owasp/modsecurity-crs:4.30.0-nginx
    container_name: shieldwall-waf
    depends_on: [juice-shop]
    environment:
      BACKEND: http://juice-shop:3000
      PORT: "8080"
      SSL_PORT: "8443"
      SERVER_NAME: localhost
      SSL_CERT_FILE: /etc/nginx/certs/server.crt
      SSL_CERT_KEY_FILE: /etc/nginx/certs/server.key
      SSL_PROTOCOLS: "TLSv1.2 TLSv1.3"
      BLOCKING_PARANOIA: "1"
      DETECTION_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      ANOMALY_OUTBOUND: "4"
      MODSEC_RULE_ENGINE: "On"
      MODSEC_AUDIT_ENGINE: "RelevantOnly"
      MODSEC_AUDIT_LOG: "/var/log/modsec_audit.log"
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./waf/custom-rules.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-SHIELDWALL.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - ./logs/waf:/var/log
    networks: [edge, backend]
    restart: unless-stopped

  analytics:
    build: ./analytics
    container_name: shieldwall-analytics
    environment:
      EVENT_FILE: /data/events.jsonl
      WAF_LOG: /logs/modsec_audit.log
      API_TOKEN: ${API_TOKEN:-change-me-local-demo}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./logs:/logs:ro
      - ./data:/data
    networks: [edge]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
