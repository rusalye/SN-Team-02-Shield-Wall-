name: shieldwall

services:
  # ---- Intentionally vulnerable target (never exposed directly) ----
  juiceshop:
    image: bkimminich/juice-shop:v17.1.1
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]

  # ---- Edge: nginx + ModSecurity v3 + OWASP CRS + TLS termination ----
  waf:
    build: ./waf
    restart: unless-stopped
    depends_on: [juiceshop]
    environment:
      SHIELD_MODE: ${SHIELD_MODE:-on}
      UPSTREAM: juiceshop:3000
      HTTPS_PUBLIC_PORT: ${HTTPS_PORT:-8443}
      PARANOIA: ${PARANOIA:-2}
      INBOUND_THRESHOLD: ${INBOUND_THRESHOLD:-5}
      LOGIN_RATE: ${LOGIN_RATE:-5r/m}
      LOGIN_BURST: ${LOGIN_BURST:-5}
      GENERAL_RATE: ${GENERAL_RATE:-50r/s}
      GENERAL_BURST: ${GENERAL_BURST:-200}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - shield-logs:/var/log/shield
      - shield-dynamic:/etc/nginx/dynamic
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    networks:
      edge:
        aliases: [shield.local]
      backend: {}

  # ---- Sentinel: log analytics, auto-ban engine, ATT&CK mapping, dashboard ----
  sentinel:
    build: ./sentinel
    restart: unless-stopped
    pid: "service:waf"          # lets Sentinel SIGHUP nginx without a docker socket
    depends_on: [waf]
    environment:
      SHIELD_MODE: ${SHIELD_MODE:-on}
      BAN_STRIKES: ${BAN_STRIKES:-20}
      STRIKE_WINDOW: ${STRIKE_WINDOW:-120}
      BAN_STEPS: ${BAN_STEPS:-300,1800,86400}
      ALLOWLIST: ${ALLOWLIST:-127.0.0.1,::1,172.28.0.1}
      SENTINEL_TOKEN: ${SENTINEL_TOKEN:-}
    volumes:
      - shield-logs:/var/log/shield:ro
      - shield-dynamic:/etc/nginx/dynamic
      - sentinel-data:/data
    ports:
      - "127.0.0.1:${SENTINEL_PORT:-9000}:9000"
    networks: [mgmt]

  # ---- Lab traffic generators (separate IPs so a ban hits only the attacker) ----
  attacker:
    profiles: ["lab"]
    build: ./lab
    depends_on: [waf]
    working_dir: /tests
    volumes: ["./lab/tests:/tests:ro", "./certs:/certs:ro", "./reports:/reports"]
    networks:
      edge: {ipv4_address: 172.28.0.100}

  client:
    profiles: ["lab"]
    build: ./lab
    depends_on: [waf]
    working_dir: /tests
    volumes: ["./lab/tests:/tests:ro", "./certs:/certs:ro", "./reports:/reports"]
    networks:
      edge: {ipv4_address: 172.28.0.101}

networks:
  edge:
    ipam: {config: [{subnet: 172.28.0.0/24}]}
  backend:
    internal: true          # the vulnerable app has no route to or from the outside
  mgmt: {}

volumes:
  shield-logs:
  shield-dynamic:
  sentinel-data:
