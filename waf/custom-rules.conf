# Shield Wall custom virtual-patching rules.
# CRS remains the primary general-purpose detection engine.
# These narrow rules are intentionally additive and should be tuned against
# the benign replay before any production use.

SecRule ARGS|ARGS_NAMES "@rx (?i)(\.\./|%2e%2e%2f|%2e%2e/)" \
 "id:1001001,phase:2,deny,status:403,log,msg:'SHIELDWALL: path traversal pattern',tag:'attack-traversal',tag:'mitre:T1190',severity:CRITICAL"

SecRule ARGS|ARGS_NAMES "@rx (?i)(;[[:space:]]*(cat|id|whoami|uname)|\|\|[[:space:]]*(cat|id|whoami)|`[^`]+`)" \
 "id:1001002,phase:2,deny,status:403,log,msg:'SHIELDWALL: command injection pattern',tag:'attack-command-injection',tag:'mitre:T1190',severity:CRITICAL"

SecRule REQUEST_HEADERS:User-Agent "@rx (?i)(sqlmap|nikto|nmap|masscan|acunetix|nessus|gobuster|ffuf)" \
 "id:1001003,phase:1,deny,status:403,log,msg:'SHIELDWALL: known scanner user agent',tag:'attack-scanner',tag:'mitre:T1595.002',severity:WARNING"


# Per-source request burst control for the login route.
# This counts requests to the endpoint (not only failed passwords).
# ModSecurity IP collections persist counters across requests.
SecAction "id:1001100,phase:1,pass,nolog,initcol:ip=%{REMOTE_ADDR}"
SecRule REQUEST_URI "@streq /rest/user/login" \
 "id:1001101,phase:1,pass,nolog,chain"
 SecRule REQUEST_METHOD "@streq POST" \
 "setvar:ip.shieldwall_login_requests=+1,expirevar:ip.shieldwall_login_requests=60"
SecRule REQUEST_URI "@streq /rest/user/login" \
 "id:1001102,phase:1,deny,status:429,log,msg:'SHIELDWALL: login request burst limit exceeded',chain"
 SecRule IP:SHIELDWALL_LOGIN_REQUESTS "@gt 10"
