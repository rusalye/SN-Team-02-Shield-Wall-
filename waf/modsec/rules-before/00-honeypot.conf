# Decoy paths that no real user of this application would ever request.
# A hit means automated reconnaissance: deny, and tag so Sentinel bans the source instantly.
SecRule REQUEST_URI_RAW "@rx (?i)^/(?:\.env|\.git(?:/|$)|\.svn/|wp-login\.php|wp-admin|wp-content|xmlrpc\.php|phpmyadmin|pma/|admin\.php|adminer|server-status|actuator/|cgi-bin/|backup\.(?:zip|sql|tar)|config\.php)" \
    "id:1000010,phase:1,t:none,deny,status:403,log,auditlog,severity:'CRITICAL',\
    msg:'ShieldWall honeypot: decoy resource probed (reconnaissance)',\
    tag:'shieldwall/honeypot',tag:'attack-reputation-scanner',tag:'attack.t1595'"
