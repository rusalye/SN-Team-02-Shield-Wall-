# Virtual patches: app-specific rules that close known flaws without touching app code.

# VPATCH-001  NoSQL operator injection ($ne, $gt, $where ...) in JSON or form keys.  CWE-943
SecRule ARGS_NAMES "@rx (?i)(?:^|[.\[])\$(?:ne|gt|gte|lt|lte|nin|in|where|regex|expr|or|and|not|exists|elemmatch)\]?$" \
    "id:1000200,phase:2,t:none,deny,status:403,log,auditlog,severity:'CRITICAL',\
    msg:'VPATCH-001 NoSQL operator injection in request parameters',\
    tag:'shieldwall/vpatch',tag:'attack-injection-generic',tag:'CWE-943',tag:'attack.t1190'"

# VPATCH-002  Server-side JavaScript evaluation via B2B order payload (RCE).  CWE-94
SecRule REQUEST_FILENAME "@beginsWith /b2b/v2/orders" \
    "id:1000210,phase:2,chain,deny,status:403,log,auditlog,severity:'CRITICAL',\
    msg:'VPATCH-002 JavaScript code in B2B orderLinesData (RCE)',\
    tag:'shieldwall/vpatch',tag:'attack-rce',tag:'CWE-94',tag:'attack.t1190'"
    SecRule ARGS:json.orderLinesData "@rx (?i)(?:function|=>|\b(?:while|for|eval|require|process|constructor|global)\b|\)\s*\(|;)" "t:none"

# VPATCH-003  /ftp poison-null-byte, double-encoding and sensitive backup files.  CWE-22 / CWE-538
SecRule REQUEST_URI_RAW "@rx (?i)^/ftp/[^?]*(?:%25(?:00|2e|2f)|%00|\.(?:bak|kdbx|pyc|yml|gg)(?:$|\?))" \
    "id:1000220,phase:1,t:none,deny,status:403,log,auditlog,severity:'CRITICAL',\
    msg:'VPATCH-003 /ftp null-byte bypass or sensitive file access',\
    tag:'shieldwall/vpatch',tag:'attack-lfi',tag:'CWE-22',tag:'attack.t1190'"
