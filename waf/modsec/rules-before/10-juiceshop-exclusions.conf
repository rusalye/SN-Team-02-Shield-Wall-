# False-positive tuning for Juice Shop. Scoped to exact targets, never whole rules.
# JWTs in the 'token' cookie and Authorization header contain base64 and '=' that trip SQLi/XSS heuristics.
SecRule REQUEST_URI "@unconditionalMatch" "id:1000100,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:token,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_COOKIES:continueCode,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;REQUEST_HEADERS:Authorization"
